<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#F3EEE4"/>
      <stop offset="1" stop-color="#E4DDCE"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8592"/>
      <stop offset="1" stop-color="#5E6874"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#E2DDD3"/>
    </linearGradient>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#55606C" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="420" cy="572" rx="290" ry="20" fill="#3B3528" opacity="0.22" filter="url(#soft)"/>

  <!-- outsole -->
  <path d="M150 512 L662 500 Q700 498 704 512 Q700 532 664 538 L180 552 Q150 551 146 534 Z" fill="#2C3035"/>

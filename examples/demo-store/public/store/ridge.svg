    <rect x="490" y="539" width="26" height="12" rx="3"/>
    <rect x="534" y="538" width="26" height="12" rx="3"/>
    <rect x="578" y="536" width="26" height="12" rx="3"/>
    <rect x="622" y="533" width="24" height="11" rx="3"/>
  </g>

  <!-- midsole -->
  <path d="M138 452 Q300 462 470 462 Q600 461 668 448 Q712 440 716 470 Q714 496 676 502 L176 516 Q140 516 136 490 Z" fill="url(#mid)"/>
  <path d="M170 492 Q420 486 690 478" stroke="#6E7A88" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- upper -->
  <path d="M146 456 Q128 400 142 352 Q150 318 178 304 Q206 318 244 330 Q290 342 330 336 Q352 300 384 268 Q410 252 438 256 Q456 262 462 284 Q500 330 560 360 Q630 392 676 420 Q708 440 704 456 Q600 470 470 470 Q300 470 146 456 Z" fill="url(#upper)"/>

name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dist/ is committed (npx runs it): it must match the source.
      - run: test -z "$(git status --porcelain -- dist)" || (git status --short -- dist; exit 1)
      # The built CLI replays the recorded runs, as a judge would run it.
      - run: node dist/cli.mjs demo --json
      # The benchmark numbers in the README match the saved run folders.
      - run: npx tsx eval/verify.ts
